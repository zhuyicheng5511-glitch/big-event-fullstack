server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端无 context-path：location /api/ 已匹配掉前缀，proxy_pass 用 / 把前缀剥掉
    # （与 vite dev 代理的 rewrite 行为一致：/api/user/login -> /user/login）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 不带尾斜杠：/swagger-ui.html 与 /v3/api-docs 本身也要能匹配到；
    # proxy_pass 不带 URI 部分，原始路径原样透传给后端
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
