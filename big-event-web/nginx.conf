server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 默认请求体上限只有 1MB，与后端 multipart 上限（10MB）对齐，
    # 否则 Docker 下上传正常大小的照片会被 nginx 以 413 拦下
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端无 context-path：location /api/ 已匹配掉前缀，proxy_pass 用 / 把前缀剥掉
    # （与 vite dev 代理的 rewrite 行为一致：/api/user/login -> /user/login）
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 不带尾斜杠：/swagger-ui.html 与 /v3/api-docs 本身也要能匹配到；
    # proxy_pass 不带 URI 部分，原始路径原样透传给后端
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 上传的图片由后端静态资源映射（/uploads/**）提供，原始路径原样透传
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
