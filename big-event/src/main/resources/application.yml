spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/big_event?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: 123456

  servlet:
    multipart:
      max-file-size: 10MB      # 限制单个文件的最大大小为 10MB（默认为 1MB）
      max-request-size: 10MB   # 限制单次请求的总文件大小为 10MB

  data:
    redis:
      host: localhost
      port: 6379
      password: # 如果您的本地 Redis 没有设置密码，这里留空即可

mybatis:
  configuration:
    map-underscore-to-camel-case: true

