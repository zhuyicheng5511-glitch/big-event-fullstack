services:
  mysql:
    image: mysql:8.0
    container_name: hoops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hoops
    ports:
      - "3306:3306"
    volumes:
      - ./big-event/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./big-event/src/main/resources/db/schema-basketball.sql:/docker-entrypoint-initdb.d/02-schema-basketball.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hoops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./big-event
    image: hoops-backend:local   # 显式 tag，供 seed 服务复用同一镜像、避免重复构建
    container_name: hoops-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 密钥不进仓库：从 .env 读取（参照 .env.example），未设置时启动直接报错
      JWT_SECRET: ${JWT_SECRET:?please set JWT_SECRET in .env, see .env.example}
    ports:
      - "8080:8080"

  # 一次性造数服务：空库上 --import-seed 导种子 CSV → --generate-stats 补到 1200 场
  # → --generate-shots 补到 10 万投篮点。三个 Runner 均有 @Order 保证先后、且幂等
  # （已有数据即跳过），所以每次 docker compose up 重跑都安全。
  # --spring.main.web-application-type=none：跑完 Runner 后 JVM 直接退出，
  # 不会留下一个不监听端口的第二 web 实例（seed 容器的职责到造数为止）。
  # restart: on-failure 兜底 mysql initdb 尚未完成的小窗口，失败自动重试直到成功。
  seed:
    build: ./big-event
    image: hoops-backend:local
    container_name: hoops-seed
    depends_on:
      backend:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?please set JWT_SECRET in .env, see .env.example}
    command: ["--import-seed", "--generate-stats", "--generate-shots", "--spring.main.web-application-type=none"]
    restart: "on-failure"

  frontend:
    build: ./big-event-web
    container_name: hoops-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
